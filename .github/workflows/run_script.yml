# 工作流名称
name: Run Python Script

# 工作流的触发条件
on:
  # 1. 允许您在 GitHub 页面的 "Actions" 标签下手动点击运行
  workflow_dispatch:
    inputs:
      only_if_missing:
        description: '已有美东当日数据时跳过运行'
        type: boolean
        default: false
  
  # 2. 定时触发 (使用 Cron 语法)
  schedule:
    # 工作日 22:17 UTC 运行。
    # - 标准时间期间 (约11月-3月): 对应美东下午 5:17 (UTC-5)
    # - 夏令时期间 (约3月-11月): 对应美东下午 6:17 (UTC-4)
    - cron: '17 22 * * 1-5'

concurrency:
  group: stock-monitor-data-update
  cancel-in-progress: false

# 定义具体要执行的任务
jobs:
  build-and-commit:
    # 在一个最新的 Ubuntu 虚拟服务器上运行
    runs-on: ubuntu-latest

    # 授予工作流写权限，以便将文件提交回仓库
    permissions:
      contents: write

    steps:
      # 第1步：将您的代码仓库下载到虚拟服务器上
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: main

      # 第2步：设置 Python 3.10 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Check daily data
        id: daily_data
        env:
          EVENT_NAME: ${{ github.event_name }}
          ONLY_IF_MISSING: ${{ inputs.only_if_missing }}
        run: |
          python - <<'PY'
          import csv
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          should_run = True
          if os.environ['EVENT_NAME'] == 'schedule' or os.environ['ONLY_IF_MISSING'] == 'true':
              today = datetime.now(ZoneInfo('America/New_York')).strftime('%Y-%m-%d')
              with open('data/portfolio_details_history.csv', newline='') as history_file:
                  should_run = not any(row['date'] == today for row in csv.DictReader(history_file))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output_file:
              output_file.write(f"should_run={str(should_run).lower()}\n")
          print('Daily data refresh required.' if should_run else 'Today\'s data already exists.')
          PY

      # 第3步：安装脚本运行所需的 Python 库
      - name: Install dependencies
        if: steps.daily_data.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "⚠️ requirements.txt not found, installing basic dependencies..."
            pip install requests pandas matplotlib numpy yfinance pytz
          fi

      # 第4步：运行主分析和收益计算脚本
      - name: Run all data generation scripts
        if: steps.daily_data.outputs.should_run == 'true'
        env:
          ALPHA_API_KEY: ${{ secrets.ALPHA_API_KEY }}
        run: |
          echo "=== Running main.py ==="
          
          if [ -n "${ALPHA_API_KEY}" ]; then
            echo "✅ Found ALPHA_API_KEY from secrets. Updating config.ini..."
            if grep -q "^api_key" config.ini; then
              sed -i "s/^api_key = .*/api_key = ${ALPHA_API_KEY}/" config.ini
            else
              echo "api_key = ${ALPHA_API_KEY}" >> config.ini
            fi
          else
            echo "⚠️ Warning: ALPHA_API_KEY not set. Using existing key in config.ini."
          fi

          # <<< 修改: 使用新的脚本路径 >>>
          python scripts/main.py
          
          echo "=== Running get_asset_performance.py ==="
          python scripts/get_asset_performance.py
          
          echo "=== Running calculate_return.py ==="
          python scripts/calculate_return.py
          
          echo "=== Running CNN_fear_greed_index.py ==="
          python scripts/CNN_fear_greed_index.py
          
          echo "=== Running fed_data.py ==="
          python scripts/fed_data.py

      # 第5步：将新生成或更新的文件提交回您的代码仓库
      - name: Commit updated data files
        if: steps.daily_data.outputs.should_run == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # <<< 修改: git add 命令指向 data/ 目录下的文件 >>>
          git add data/portfolio_details_history.csv data/portfolio_value_chart.png data/portfolio_pie_chart.png data/portfolio_return.json data/portfolio_assets_returns.json data/fear_greed_index.json data/economic_indicators.json
          
          # 检查是否有文件被修改，如果有，才执行提交和推送
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "📊 Automated data, charts, and returns update"
            git push
          fi
